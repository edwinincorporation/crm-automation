<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Management Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:#f4f6f9;color:#1f2937}
header{background:#12355b;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px}
header h1{font-size:17px;margin:0;flex:1}header small{opacity:.8}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid #dde3ea;padding:0 12px;flex-wrap:wrap}
nav button{border:0;background:none;padding:11px 14px;cursor:pointer;font-size:14px;color:#475569;border-bottom:3px solid transparent}
nav button.on{color:#12355b;border-color:#12355b;font-weight:600}
main{padding:18px;max-width:1200px;margin:auto}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat b{font-size:26px;display:block}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #eef1f5;vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:#64748b}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #cbd5e1;border-radius:6px;width:100%}
textarea{min-height:90px}
button.b{background:#12355b;color:#fff;border:0;border-radius:6px;padding:7px 13px;cursor:pointer}
button.b.g{background:#15803d}button.b.r{background:#b91c1c}button.b.l{background:#e2e8f0;color:#1f2937}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.row>*{flex:1;min-width:140px}.row>button{flex:0}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#e2e8f0;margin:1px}
.tag.w{background:#fef3c7}.tag.ok{background:#dcfce7}.tag.bad{background:#fee2e2}
#login{max-width:340px;margin:12vh auto}pre{white-space:pre-wrap;margin:0;font:inherit}
.msg{padding:9px 12px;border-radius:6px;margin-bottom:10px;background:#e0f2fe}.msg.err{background:#fee2e2}
button.big{font-size:15px;padding:10px 18px}
.todo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.todo b.n{font-size:34px;min-width:56px}.todo .t{flex:1;min-width:200px}.todo small{color:#64748b;display:block}
.tag.ok2{background:#dcfce7;color:#166534}.tag.warn{background:#fef3c7;color:#92400e}.tag.no{background:#fee2e2;color:#991b1b}
.banner{padding:8px 12px;border-radius:6px;margin-bottom:12px;font-weight:600}.banner.test{background:#fef3c7;color:#92400e}.banner.live{background:#dcfce7;color:#166534}
label{font-size:12px;color:#64748b;display:block;margin-bottom:2px}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,tab='dashboard',flash=null;
async function api(p,o={}){const r=await fetch('/api/'+p,{method:o.method||(o.body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});
 const j=await r.json().catch(()=>({}));if(r.status===401&&me){me=null;render();}if(!r.ok)throw new Error(j.error||r.status);return j;}
function say(m,err){flash={m,err};render();}
const TABS=[['dashboard','Aaj ka kaam'],['closer','Task Closer'],['letters','Send Letter'],['mailmeter','Mail Meter Check'],['whatsapp','WhatsApp Check'],['gem','GeM Tenders'],['outbox','Outbox / Approvals'],['rules','Action Rules'],['macros','Macros'],['automations','Automations'],['pending','Auto Approvals'],['assign','Task Assignment'],['learn','Learning'],['workflows','Workflow Analysis'],['emails','Email Analysis'],['activity','Activity Log'],['users','Users']];

async function render(){
 const app=$('#app');
 if(!me){app.innerHTML=`<div id="login" class="card"><h2>CRM Management Portal</h2>
 <label>Username</label><input id="u"><br><br><label>Password</label><input id="p" type="password"><br><br>
 <button class="b" id="go">Login</button><p id="le" style="color:#b91c1c"></p></div>`;
 const go=async()=>{try{me=await api('login',{body:{username:$('#u').value,password:$('#p').value}});tab='dashboard';render();}catch(e){$('#le').textContent=e.message}};
 $('#go').onclick=go;$('#p').onkeydown=e=>e.key==='Enter'&&go();return;}
 const tabs=TABS.filter(t=>t[0]!=='users'||me.role==='admin');
 app.innerHTML=`<header><h1>CRM Management Portal ${me.demo?'<small>(DEMO data)</small>':''}</h1><small>${esc(me.username)} · ${esc(me.role)}</small><button class="b l" id="lo">Logout</button></header>
 <nav>${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</nav><main id="m"></main>`;
 $('#lo').onclick=async()=>{await api('logout',{method:'POST'});me=null;render();};
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;flash=null;render();});
 const m=$('#m');if(flash){m.innerHTML=`<div class="msg ${flash.err?'err':''}">${esc(flash.m)}</div>`;flash=null;}
 try{await VIEWS[tab](m);}catch(e){m.insertAdjacentHTML('beforeend',`<div class="msg err">${esc(e.message)}</div>`);}
}
const VIEWS={
async dashboard(m){const d=await api('dashboard');const go=t=>{tab=t;render();};
 const row=(n,title,sub,btn,t)=>`<div class="card todo"><b class="n">${n}</b><div class="t"><b>${title}</b><small>${sub}</small></div>${n>0&&btn?`<button class="b g big" data-go="${t}">${btn}</button>`:`<span class="tag ok2">Kuch baaki nahi</span>`}</div>`;
 m.insertAdjacentHTML('beforeend',`<div class="banner ${d.dry?'test':'live'}">${d.dry?'TEST MODE — abhi kuch bhi sach me nahi bhejta / close nahi karta. Sirf dikhata hai.':'LIVE — letters sach me jayenge aur tasks close honge.'}</div>
 <h3 style="margin:0 0 10px">Aaj ka kaam</h3>
 ${row(d.letters,'Letters bhejne baaki','In contacts par letter ka open task hai. Ek click me letter jayega aur task close hoga.','Letters bhejo','letters')}
 ${row(d.unassigned,'Tasks jinka koi staff nahi (Assign_to khali)','Ek click me rule ke hisaab se staff ko baant do.','Tasks baanto','assign')}
 ${row(d.pendingOutbox,'Messages approval ke intezaar me','Email / letter / WhatsApp jo tumhari haan ke bina nahi jayenge.','Dekho aur approve karo','outbox')}
 ${row(d.pendingActions,'Automation ke kaam approve karne hain','Automation ne jo karna chaha, tumhari haan chahiye.','Dekho','pending')}
 ${row(d.pendingEmails,'Emails review karne hain','Emails se CRM me kya update hoga, check karo.','Dekho','emails')}
 <div id="sum"></div>
 <div class="grid"><div class="card stat"><b>${d.open}</b>Kul open tasks</div><div class="card stat"><b>${d.overdue}</b>Der ho chuki (overdue)</div></div>
 <details class="card"><summary><b>Group ke hisaab se open tasks</b></summary><table>${Object.entries(d.byDept).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table></details>`);
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 try{const u=await api('summary');const c=u.assign_check;
  $('#sum').innerHTML=`<div class="card"><h3 style="margin:0 0 8px">Pichhle 24 ghante</h3>
  <p>Letters bheje: <b>${u.letters}</b> · Tasks baante gaye: <b>${Math.max(0,u.assigned)}</b></p>
  ${u.assign_mode==='0'?'<p><small>Auto-check band hai (Task Assignment me chalu kar sakte ho).</small></p>':c?`<p><small>Auto-check (${u.assign_mode==='1'?'apne aap baantta hai':'sirf check'}): ${new Date(c.at).toLocaleString('en-IN')} — ${c.ready} tayyar, ${c.undecided} ka faisla baaki${c.applied?', '+c.applied+' baante gaye':''}.</small></p>`:'<p><small>Auto-check abhi chala nahi.</small></p>'}
  ${u.automations.length?'<small>Automations: '+u.automations.map(a=>esc(a.name)+' ('+(a.error?'error':'matched '+a.matched+', handled '+a.handled)+')').join(' · ')+'</small>':''}
  ${u.errors.length?'<div class="msg err" style="margin-top:8px"><b>Atke hue / errors</b><br>'+u.errors.map(e=>esc(e.detail)).join('<br>')+'</div>':''}</div>`;}catch(e){}},

async closer(m){
 m.insertAdjacentHTML('beforeend',`<div class="card"><div class="row"><div><label>Search</label><input id="q"></div><div><label>Group (Dept_Name)</label><input id="dp"></div>
 <div><label>Status</label><select id="st"><option value="">Any open</option><option>Not Started</option><option>In Progress</option><option>Deferred</option><option>Waiting on someone else</option></select></div><button class="b" id="f">Filter</button></div>
 <div id="tl">Loading…</div></div>`);
 const load=async()=>{const qs=new URLSearchParams({q:$('#q').value,dept:$('#dp').value,status:$('#st').value});
  const t=await api('tasks?'+qs);const macros=await api('macros');
  $('#tl').innerHTML=`<table><tr><th><input type="checkbox" id="all" style="width:auto"></th><th>Task</th><th>Contact</th><th>Group</th><th>Due</th><th>Status</th><th>Action on close</th></tr>
  ${t.map(x=>`<tr><td><input type="checkbox" class="ck" value="${esc(x.id)}" style="width:auto"></td><td>${esc(x.Subject)}</td><td>${esc(x.Who_Id?.name||'')}</td><td>${esc(x.Dept_Name||'')}</td><td>${esc(x.Due_Date||'')}</td><td>${esc(x.Status)}</td>
  <td>${x.rules.length?x.rules.map(r=>`<span class="tag w">${esc(r.action_type)}: ${esc(r.name)}</span>`).join(''):'<span class="tag">none</span>'}</td></tr>`).join('')}</table>
  <p>${t.length} task(s)</p><div class="row"><div><label>Closing note</label><input id="note" placeholder="Saved in the task and available as {{note}}"></div>
  <button class="b g" id="cl">Close selected</button></div>
  <label><input type="checkbox" id="skip" style="width:auto"> Close only — do not run email/letter/WhatsApp actions</label>
  <hr><div class="row"><div><label>Run a macro on selected tasks</label><select id="mc">${macros.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.summary.join(' → '))}</option>`).join('')}</select></div>
  <button class="b l" id="mcd">Preview</button><button class="b" id="mcr">Run macro</button></div>`;
  const runMc=async dry=>{const ids=[...document.querySelectorAll('.ck:checked')].map(c=>c.value);
   if(!ids.length)return alert('Select tasks first');if(!$('#mc').value)return alert('No macro yet — create one in the Macros tab');
   if(!dry&&!confirm(`Run this macro on ${ids.length} task(s)?`))return;
   try{const r=await api('tasks/run-macro',{body:{ids,macro_id:+$('#mc').value,dry}});
    say((dry?'PREVIEW (nothing changed): ':'Done: ')+r.results.map(x=>(x.subject||x.id)+' → '+(x.steps?x.steps.join('; '):x.error)).join(' | '),false);}catch(e){say(e.message,true);}};
  $('#mcr').onclick=()=>runMc(false);$('#mcd').onclick=()=>runMc(true);
  $('#all').onchange=e=>document.querySelectorAll('.ck').forEach(c=>c.checked=e.target.checked);
  $('#cl').onclick=async()=>{const ids=[...document.querySelectorAll('.ck:checked')].map(c=>c.value);
   if(!ids.length)return alert('Select tasks first');
   if(!confirm(`Close ${ids.length} task(s)? Rules with approval go to the Outbox; others are sent immediately.`))return;
   try{const r=await api('tasks/close',{body:{ids,note:$('#note').value,skipActions:$('#skip').checked}});
    const q=r.results.reduce((a,x)=>a+(x.queued||0),0),s=r.results.reduce((a,x)=>a+(x.sent||0),0),er=r.results.filter(x=>x.errors?.length||x.error);
    say(`Closed ${r.results.length} task(s). Sent: ${s}. Waiting for approval: ${q}.`+(er.length?` Problems: ${er.map(x=>x.error||x.errors.join('; ')).join(' | ')}`:''),er.length>0);}catch(e){say(e.message,true);}};};
 $('#f').onclick=load;await load();},

async outbox(m){const o=await api('outbox');
 m.insertAdjacentHTML('beforeend',`<div class="card"><table><tr><th>#</th><th>Type</th><th>To</th><th>Message</th><th>Status</th><th></th></tr>
 ${o.map(x=>`<tr><td>${x.id}</td><td>${esc(x.action_type)}</td><td>${esc(x.to_name)}<br><small>${esc(x.to_email||x.to_phone||'— no address —')}</small></td>
 <td><b>${esc(x.subject)}</b>${(x.status==='pending'||x.status==='failed')?`<textarea data-b="${x.id}">${esc(x.body)}</textarea>`:`<pre>${esc(x.body)}</pre>`}</td>
 <td><span class="tag ${x.status.startsWith('sent')?'ok':x.status==='failed'?'bad':''}">${esc(x.status)}</span>${x.error?`<br><small>${esc(x.error)}</small>`:''}</td>
 <td>${(x.status==='pending'||x.status==='failed')&&me.role!=='executive'?`<button class="b g" data-a="${x.id}">Send</button> <button class="b r" data-r="${x.id}">Reject</button>`:''}</td></tr>`).join('')}</table></div>`);
 m.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{try{const body=m.querySelector(`[data-b="${b.dataset.a}"]`).value;const r=await api(`outbox/${b.dataset.a}/approve`,{body:{body}});say(r.ok?'Sent':'Send failed: '+r.item.error,!r.ok);}catch(e){say(e.message,true)}});
 m.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await api(`outbox/${b.dataset.r}/reject`,{method:'POST',body:{}});render();});},

async rules(m){const r=await api('rules');
 m.insertAdjacentHTML('beforeend',`<div class="card"><h3>Action Rules — what happens when a task is closed</h3>
 <p>If the task's Subject (or Group) contains the match text, the chosen action is prepared. Placeholders: <code>{{name}} {{subject}} {{dept}} {{email}} {{phone}} {{note}}</code></p>
 <div class="row"><div><label>Rule name</label><input id="rn"></div><div><label>Match in</label><select id="rf"><option value="Subject">Task subject</option><option value="Dept_Name">Group (Dept_Name)</option></select></div>
 <div><label>Match text</label><input id="rm"></div><div><label>Action</label><select id="ra"><option value="email">Send email</option><option value="letter">Send letter (PDF by email)</option><option value="whatsapp">Send WhatsApp</option></select></div></div>
 <div class="row"><div><label>Subject (email / letter)</label><input id="rs"></div></div>
 <label>Message</label><textarea id="rb" placeholder="Dear {{name}}, ..."></textarea><br>
 <label><input type="checkbox" id="rq" checked style="width:auto"> Ask for approval before sending (recommended)</label><br>
 <button class="b" id="rsv">Add rule</button></div>
 <div class="card"><table><tr><th>Name</th><th>Match</th><th>Action</th><th>Approval</th><th></th></tr>
 ${r.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.match_field)} contains “${esc(x.match_value)}”</td><td>${esc(x.action_type)}</td><td>${x.require_approval?'Yes':'No — sends automatically'}</td><td>${me.role!=='executive'?`<button class="b r" data-d="${x.id}">Delete</button>`:''}</td></tr>`).join('')}</table></div>`);
 $('#rsv').onclick=async()=>{try{await api('rules',{body:{name:$('#rn').value,match_field:$('#rf').value,match_value:$('#rm').value,action_type:$('#ra').value,subject:$('#rs').value,body:$('#rb').value,require_approval:$('#rq').checked}});say('Rule saved');}catch(e){say(e.message,true)}};
 m.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this rule?')){await api('rules/'+b.dataset.d,{method:'DELETE'});render();}});},

async macros(m){const ms=await api('macros');
 m.insertAdjacentHTML('beforeend',`<div class="card"><h3>Ready-made (ek click)</h3><p><small><b>Missed call:</b> "missed call" wale tasks me note likh ke task close. Automation <b>Preview</b> me banegi (kuch badlegi nahi); Automations tab me dekh ke tum mode badlo.</small></p>${me.role!=='executive'?'<button class="b g" id="smc">Missed call macro + automation banao</button>':''}</div>`);
 if($('#smc'))$('#smc').onclick=async()=>{try{await api('starter/missed-call',{method:'POST',body:{}});say('Ban gaya — Automations tab me "Missed call tasks" (Preview mode) dekho.');}catch(e){say(e.message,true)}};
 m.insertAdjacentHTML('beforeend',`<div class="card"><h3>New macro — a saved set of actions for a task</h3>
 <p>Fill only the parts you need. Steps run in this order: fields → assign → note → follow-up task → message → close.</p>
 <div class="row"><div><label>Macro name</label><input id="mn" placeholder="e.g. Not interested - close"></div></div>
 <label>Fields to update (one per line, <code>ApiName=Value</code>, e.g. <code>Dept_Name=All Conferences</code>)</label><textarea id="mf" style="min-height:60px"></textarea>
 <div class="row"><div><label>Assign task to (staff name, written to Assign_to)</label><input id="ma"></div><div><label>Note to add</label><input id="mt" placeholder="supports {{name}} {{subject}} {{dept}}"></div></div>
 <div class="row"><div><label>Follow-up task subject</label><input id="mfs"></div><div><label>Due in (days)</label><input id="mfd" type="number" value="2"></div></div>
 <div class="row"><div><label>Send message</label><select id="mc"><option value="">— none —</option><option value="email">Email</option><option value="letter">Letter (PDF)</option><option value="whatsapp">WhatsApp</option></select></div><div><label>Message subject</label><input id="ms"></div></div>
 <textarea id="mb" placeholder="Message text, e.g. Dear {{name}}, ..."></textarea>
 <label><input type="checkbox" id="mq" checked style="width:auto"> Ask approval before the message is sent</label>
 <label><input type="checkbox" id="mcl" style="width:auto"> Close the task at the end</label><br>
 <button class="b" id="msv">Save macro</button></div>
 <div class="card"><table><tr><th>Macro</th><th>Steps</th><th></th></tr>${ms.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.summary.map(esc).join(' → ')}</td><td>${me.role!=='executive'?`<button class="b r" data-d="${x.id}">Delete</button>`:''}</td></tr>`).join('')}</table></div>`);
 $('#msv').onclick=async()=>{const st=[];const f={};
  $('#mf').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{const i=l.indexOf('=');if(i>0)f[l.slice(0,i).trim()]=l.slice(i+1).trim();});
  if(Object.keys(f).length)st.push({type:'update_fields',fields:f});
  if($('#ma').value)st.push({type:'assign',owner:$('#ma').value});
  if($('#mt').value)st.push({type:'note',text:$('#mt').value});
  if($('#mfs').value)st.push({type:'create_task',subject:$('#mfs').value,days:+$('#mfd').value});
  if($('#mc').value)st.push({type:'message',channel:$('#mc').value,subject:$('#ms').value,body:$('#mb').value,approval:$('#mq').checked});
  if($('#mcl').checked)st.push({type:'close'});
  try{await api('macros',{body:{name:$('#mn').value,steps:st}});say('Macro saved');}catch(e){say(e.message,true)}};
 m.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this macro?')){try{await api('macros/'+b.dataset.d,{method:'DELETE'});render();}catch(e){say(e.message,true)}}});},

async automations(m){const [as,ms]=await Promise.all([api('automations'),api('macros')]);
 const sched=a=>{try{const s=JSON.parse(a.schedule);return s.type==='times'?`daily at ${s.times.join(', ')} (IST)`+(s.days?.length&&s.days.length<7?` on days ${s.days.join(',')}`:''):s.type==='every'?`every ${s.minutes} min`:'manual only';}catch{return '—'}};
 m.insertAdjacentHTML('beforeend',`<div class="card"><h3>New automation — which tasks, which macro, when</h3>
 <p>Start in <b>Preview</b> (shows what it would do, changes nothing), then switch to <b>Ask approval</b>, and only later to <b>Automatic</b>. Each task is handled once per automation.</p>
 <div class="row"><div><label>Name</label><input id="an"></div><div><label>Match in</label><select id="af"><option value="Subject">Task subject</option><option value="Dept_Name">Group (Dept_Name)</option></select></div><div><label>Match text</label><input id="am"></div>
 <div><label>Status is</label><select id="as"><option value="">Any</option><option>Not Started</option><option>In Progress</option><option>Deferred</option><option>Waiting on someone else</option></select></div><div><label>Overdue at least (days)</label><input id="ao" type="number" value="0"></div></div>
 <div class="row"><div><label>Run this macro</label><select id="amc">${ms.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
 <div><label>Mode</label><select id="amo"><option value="preview">Preview only</option><option value="approve">Ask approval</option><option value="auto">Automatic</option></select></div>
 <div><label>Schedule</label><select id="asc"><option value="manual">Manual only (Run now button)</option><option value="times">Daily at times</option><option value="every">Every N minutes</option></select></div>
 <div><label>Times (IST, comma) / minutes</label><input id="at" placeholder="09:30,17:00  or  60"></div><div><label>Max tasks per run</label><input id="ax" type="number" value="25"></div></div>
 <button class="b" id="asv">Save automation</button></div>
 <div class="card"><table><tr><th>Automation</th><th>Condition</th><th>Macro / mode</th><th>Schedule</th><th>Last run</th><th></th></tr>
 ${as.map(x=>{let lr={};try{lr=JSON.parse(x.last_result||'{}')}catch{}return `<tr><td><b>${esc(x.name)}</b><br><span class="tag ${x.active?'ok':'bad'}">${x.active?'on':'off'}</span></td>
 <td>${x.match_value?esc(x.match_field)+' contains “'+esc(x.match_value)+'”<br>':''}${x.status_filter?'Status '+esc(x.status_filter)+'<br>':''}${x.min_overdue_days?'Overdue ≥ '+x.min_overdue_days+'d':''}</td>
 <td>${esc(x.macro_name||'?')}<br><span class="tag w">${esc(x.mode)}</span></td><td>${esc(sched(x))}</td>
 <td><small>${x.last_run?esc(new Date(x.last_run).toLocaleString('en-IN')):'never'}<br>${lr.error?'Error: '+esc(lr.error):lr.matched!==undefined?`matched ${lr.matched}, handled ${lr.handled}`:''}</small>${lr.notes?.length?`<details><summary>details</summary><small>${lr.notes.map(esc).join('<br>')}</small></details>`:''}</td>
 <td>${me.role!=='executive'?`<button class="b" data-run="${x.id}">Run now</button> <button class="b l" data-tg="${x.id}">${x.active?'Pause':'Resume'}</button> <button class="b l" data-rs="${x.id}" title="Let it handle already-seen tasks again">Reset</button> <button class="b r" data-d="${x.id}">Delete</button>`:''}</td></tr>`}).join('')}</table></div>`);

 let D=null;

  <details><summary><b>Pehle se nipte / Zoho me nahi mile (${other.length})</b></summary><table>${other.map(r=>`<tr><td>${esc(r.email)}</td><td>${esc(r.campaign)}</td><td>${esc(r.kind)}</td><td><small>${esc(r.handled||r.problem)}</small></td></tr>`).join('')}</table></details>`;
  if(!todo.length)return;

    try{const r=await api('mailmeter/create',{body:{keys:k}});const bad=r.results.filter(x=>!x.ok);$('#mout').innerHTML=r.results.map(x=>`<p>${x.ok?'<span class="tag ok2">'+(x.dry?'Test':'Ban gaya')+'</span>':'<span class="tag no">Nahi bana</span>'} ${esc(x.subject||x.error||'')}</p>`).join('');if(!r.dry&&!bad.length)go();}catch(e){say(e.message,true)}};
   $('#msk').onclick=async()=>{const k=keys();if(!k.length)return;if(!confirm(k.length+' entry list se hata dein (task nahi banega)?'))return;await api('mailmeter/skip',{body:{keys:k}});go();};}};
 const go=async()=>{$('#mres').textContent='Check ho raha hai…';try{D=await api('mailmeter/check?days='+$('#md').value);draw();}catch(e){$('#mres').innerHTML=`<div class="msg err">${esc(e.message)}</div>`;}};
 $('#mgo').onclick=go;if($('#mpsv'))$('#mpsv').onclick=async()=>{await api('mailmeter/prefix',{body:{prefix:$('#mpx').value}});say('Save ho gaya');};go();},

 <button class="b" id="rsv">Rule jodo</button><table style="margin-top:10px">${rules.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.match_field)} me “${esc(r.match_value)}”</td><td>${r.employee_ids.map(i=>esc(en[i]||'?')).join(', ')}</td><td>${can?`<button class="b r" data-dr="${r.id}">Delete</button>`:''}</td></tr>`).join('')}</table></details>

 $('#ssv').onclick=async()=>{try{await api('assign/settings',{body:{assign_auto:$('#sau').value,assign_minutes:+$('#sam').value}});say('Save ho gaya');}catch(e){say(e.message,true)}};

 $('#nfc').onclick=async()=>{try{const r=await api('assign/name-fixes'),o=$('#nfo');

  if($('#nfa'))$('#nfa').onclick=async()=>{const items=[...o.querySelectorAll('.nf:checked')].map(c=>({task_id:r.fixes[+c.value].id,name:r.fixes[+c.value].to}));if(!items.length)return;if(!confirm(items.length+' task ka Assign_to badlega. Theek hai?'))return;const x=await api('assign/name-fixes',{body:{items}});const bad=x.results.filter(y=>!y.ok);say((x.results.length-bad.length)+' naam theek hue.'+(bad.length?' Problem: '+bad.map(y=>y.error).join(' | '):''),bad.length>0);};}catch(e){say(e.message,true)}};

  box.innerHTML=`${(p.staff_added||[]).length?'<div class="msg">Tasks ke Assign_to se naye staff jude: <b>'+p.staff_added.map(esc).join(', ')+'</b></div>':''}<p><span class="tag ok2">${p.manual_untouched} task me pehle se naam hai — chhede nahi jayenge</span></p>
  <h4>Rule se tayyar (${p.proposals.length})</h4><table>${p.proposals.map(x=>`<tr><td>${esc(x.subject)}</td><td><small>${esc(x.rule)}</small></td><td>→ <b>${esc(x.employee.name)}</b></td></tr>`).join('')||'<tr><td>Koi nahi</td></tr>'}</table>
